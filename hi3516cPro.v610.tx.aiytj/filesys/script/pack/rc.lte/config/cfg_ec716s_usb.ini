[config]
agbaud=3000000
dlbaud=130000

[control]
detect = 0
atreset = at+ecrst=delay,1000
atbaud = 115200
uart_timeout = 100
pullup_qspi = 1
debug = 0
dribble_dld_en = 1
usb_enable = 1
;dld_upg_ctrl_valid=1
;dld_upg_connwait_100ms_cnt=50
;dld_upg_ctrlwait_100ms_cnt=100

[storage_cfg]
format_path = /tmp/lte/format_ec716s.json

[package_info]
pkgpath = /tmp/lte/image_ec716s/at_command.hbinpkg

[agentboot]
agpath = /tmp/lte/image_ec716s/agentboot_usb/agentboot.bin
ctrl = 6
; unit: MB
ap_size = 2
; unit: MB, 15 means none
cp_size = 15

[bootloader]
blpath = /tmp/lte/image_ec716s/ap_bootloader.bin
burnaddr = 0x3000

[system]
syspath = /tmp/lte/image_ec716s/ap_at_command.bin
burnaddr = 0x72000

[cp_system]
cp_syspath = /tmp/lte/image_ec716s/cp-demo-flash.bin
burnaddr = 0x1a000
storage_type=ap_flash

[flexfile0]
filepath =  /tmp/lte/rfCaliTb_ec716s/MergeRfTable_EC716S.bin
burnaddr = 0x1f3000
storage_type=ap_flash


[otherfile1]
filepath = fs.fs
burnaddr = 0xb84000
;ap_flash起始地址为0x800000；cp_flash起始地址为0x8800000
storage_type=ap_flash
		
[otherfile2]
filepath = /tmp/lte/rfCaliTb_ec716s/MergeRfTable_EC716s_48K.bin
burnaddr = 0xe7000
storage_type=cp_flash

[otherfile3]

[otherfile4]

[otherfile5]
